<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Tracking Color Selector</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="main-page" class="page active">
        <h1>Eye Tracking Color Selector</h1>
        <p class="instructions">Look at a color square for 2 seconds to select it</p>

        <div class="calibration-info">
            <p id="calibration-status">Initializing eye tracking...</p>
            <button id="calibrate-btn" style="display:none;">Calibrate</button>
        </div>

        <div class="grid-container">
            <div class="color-square" data-color="#FF6B6B" style="background-color: #FF6B6B;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#4ECDC4" style="background-color: #4ECDC4;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#45B7D1" style="background-color: #45B7D1;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#FFA07A" style="background-color: #FFA07A;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#98D8C8" style="background-color: #98D8C8;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#F7DC6F" style="background-color: #F7DC6F;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#BB8FCE" style="background-color: #BB8FCE;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#85C1E2" style="background-color: #85C1E2;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#F8B88B" style="background-color: #F8B88B;">
                <div class="loading-circle"></div>
            </div>
            <div class="color-square" data-color="#52B788" style="background-color: #52B788;">
                <div class="loading-circle"></div>
            </div>
        </div>
    </div>

    <div id="color-page" class="page">
        <button id="back-btn">Back to Selection</button>
    </div>

    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <script src="app.js"></script>
</body>
</html>
